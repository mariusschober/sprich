name: Codex production review CI

on:
  push:
    branches:
      - codex/senior-production-review

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Show repository state
        run: |
          git status --short --branch
          git rev-parse HEAD
          java -version
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify model manifest
        run: ./scripts/verify-models.sh
      - name: Inspect APK
        run: ./scripts/check-apk.sh
      - name: Archive reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-ci-output
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 3
