name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  host-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Assemble release (unsigned CI)
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Bundle release
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Verify models/package
        run: |
          ./scripts/verify-models.sh || true
          ./scripts/check-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk || true
          echo "16KB host check (llvm-readelf)"
          find app/build -name "*.so" | head
