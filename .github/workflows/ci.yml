name: Release gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  host-gate:
    runs-on: ubuntu-24.04
    env:
      SPRICH_VERSION_CODE: ${{ github.run_number }}
      SPRICH_VERSION_NAME: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - name: Tests, release lint, R8 APK and bundle (unsigned CI artifacts)
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease :app:writeReleaseDependencyInventory --stacktrace
      - name: Verify runtime inputs and notices
        run: ./scripts/verify-models.sh --inventory app/build/reports/release-runtime-dependencies.tsv
      - name: Verify actual release APK
        run: ./scripts/check-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Reject skipped or empty unit-test evidence
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          suites = [E.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          assert suites and sum(int(s.get('tests', 0)) for s in suites) > 0, 'No test evidence'
          assert all(int(s.get(k, 0)) == 0 for s in suites for k in ['failures', 'errors', 'skipped']), 'Failed or skipped tests'
          print('PASS:', sum(int(s.get('tests', 0)) for s in suites), 'unit tests; zero failures/errors/skips')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-ci-release-and-reports
          path: |
            app/build/outputs/apk/release/
            app/build/outputs/bundle/release/
            app/build/outputs/mapping/release/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error
